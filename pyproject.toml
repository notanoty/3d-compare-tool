[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-compare"
version = "0.1.0"
description = "Drop an original model and a scan, get plain accuracy numbers."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.0",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff", "black"]

[project.scripts]
mesh-compare = "mesh_compare.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["trimesh.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["conftest", "test_comparison", "test_gui", "test_heatmap"]
disallow_untyped_calls = false
